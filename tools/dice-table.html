<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>オリジナル表 | FCTZS TRPG部</title>
  <link rel="icon" href="https://github.com/ronitoak/FCTZS-TRPG/blob/main/img/favicon.ico?raw=true" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <nav id="common-nav" class="top-nav"></nav>
    <hr />

    <main class="tools-page">
      <a class="tools-back" href="./index.html">← Tools</a>
      <header class="page-header">
        <h1>オリジナル表</h1>
        <p class="u-muted">表タイトルと項目を入力し、<code>/roll-table</code> 形式のテキストを作成します。</p>
      </header>

      <div class="tools-layout">
        <div class="tools-panel">
          <h3 class="tools-section-title">表情報</h3>
          <label>表タイトル
            <input type="text" id="dice-title" value="オリジナル表" maxlength="80">
          </label>
          <label>項目数
            <input type="number" id="dice-count" value="4" min="1" max="100" step="1">
          </label>

          <h3 class="tools-section-title">項目入力</h3>
          <div id="dice-items" class="tools-kv-rows" aria-label="項目一覧"></div>

          <div class="tools-actions">
            <button type="button" id="dice-copy" class="btn-primary">テキストをコピー</button>
          </div>
        </div>

        <div class="tools-preview-box" style="align-items:stretch;">
          <h3 class="tools-section-title">作成結果</h3>
          <pre id="dice-preview" class="tools-result" aria-live="polite"></pre>
        </div>
      </div>
    </main>

    <footer>
      <hr />
      <small><a href="../index.html">Back to Home</a></small>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/init-supabase.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/tools-common.js"></script>
  <script src="../js/tools-dice-table.js"></script>
  <script>
    Utils.initAuthAndHeader("common-nav", "../");
  </script>
</body>
</html>
