<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPCコマ作成 | FCTZS TRPG部</title>
  <link rel="icon" href="https://github.com/ronitoak/FCTZS-TRPG/blob/main/img/favicon.ico?raw=true" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <nav id="common-nav" class="top-nav"></nav>
    <hr />

    <main class="tools-page">
      <a class="tools-back" href="./index.html">← Tools</a>
      <header class="page-header">
        <h1>NPCコマ作成</h1>
        <p class="u-muted">ココフォリアに貼り付けできるキャラクター JSON を作ります。</p>
      </header>

      <div class="tools-layout">
        <div class="tools-panel">
          <h3 class="tools-section-title">基本</h3>
          <label>名前
            <input type="text" id="npc-name" value="NPC" maxlength="80">
          </label>
          <label>イニシアチブ
            <input type="number" id="npc-initiative" value="0" step="1">
          </label>
          <label>メモ
            <textarea id="npc-memo" rows="3" placeholder="メモ（任意）"></textarea>
          </label>

          <h3 class="tools-section-title">ステータス <button type="button" id="npc-add-status" class="btn-small btn-secondary">行追加</button></h3>
          <div id="npc-status-rows" class="tools-kv-rows" aria-label="ステータス一覧"></div>

          <h3 class="tools-section-title">パラメータ <button type="button" id="npc-add-param" class="btn-small btn-secondary">行追加</button></h3>
          <div id="npc-param-rows" class="tools-kv-rows" aria-label="パラメータ一覧"></div>

          <h3 class="tools-section-title">技能値 <button type="button" id="npc-add-skill" class="btn-small btn-secondary">行追加</button></h3>
          <p class="u-muted tools-hint">技能はパラメータにも載せ、チャットパレット（commands）へ判定コマンドも生成します。</p>
          <div id="npc-skill-rows" class="tools-kv-rows" aria-label="技能一覧"></div>

          <div class="tools-actions">
            <button type="button" id="npc-copy-json" class="btn-primary">ココフォリア JSON をコピー</button>
          </div>
        </div>

        <div class="tools-preview-box" style="align-items:stretch;">
          <h3 class="tools-section-title">JSONプレビュー</h3>
          <pre id="npc-json-preview" class="tools-result" aria-live="polite"></pre>
        </div>
      </div>
    </main>

    <footer>
      <hr />
      <small><a href="../index.html">Back to Home</a></small>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/init-supabase.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/tools-common.js"></script>
  <script src="../js/tools-npc-token.js"></script>
  <script>
    Utils.initAuthAndHeader("common-nav", "../");
  </script>
</body>
</html>
