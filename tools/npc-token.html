<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NPCコマ作成 | FCTZS TRPG部</title>
  <link rel="icon" href="https://github.com/ronitoak/FCTZS-TRPG/blob/main/img/favicon.ico?raw=true" type="image/png">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">
    <nav id="common-nav" class="top-nav"></nav>
    <hr />

    <main class="tools-page">
      <a class="tools-back" href="./index.html">← Tools</a>
      <header class="page-header">
        <h1>NPCコマ作成</h1>
        <p class="u-muted">ココフォリアに貼り付けできるキャラクター JSON を作ります。</p>
      </header>

      <div class="tools-panel tools-panel-wide">
        <label>名前
          <input type="text" id="npc-name" value="NPC" maxlength="80">
        </label>

        <h3 class="tools-section-title">ステータス <button type="button" id="npc-add-status" class="btn-small btn-secondary">行追加</button></h3>
        <div id="npc-status-rows" class="tools-kv-rows" aria-label="ステータス一覧"></div>

        <h3 class="tools-section-title">
          パラメータ
          <span class="tools-section-actions">
            <button type="button" id="npc-roll-all" class="btn-small btn-secondary">一括ダイス</button>
            <button type="button" id="npc-add-param" class="btn-small btn-secondary">行追加</button>
          </span>
        </h3>
        <p class="u-muted tools-hint">ダイス: STR・CON・POW・DEX・APP=3D6 ／ SIZ・INT=2D6+6 ／ EDU=3D6+3</p>
        <div id="npc-param-rows" class="tools-kv-rows" aria-label="パラメータ一覧"></div>

        <h3 class="tools-section-title">表示項目</h3>
        <div class="tools-derived tools-derived-inline">
          <label class="tools-derived-field">
            <span>イニシアチブ</span>
            <input type="number" id="npc-initiative" value="0" step="1">
          </label>
          <div class="tools-derived-field">
            <span>ダメージボーナス</span>
            <strong id="npc-db-display">―</strong>
          </div>
        </div>

        <h3 class="tools-section-title">表示設定</h3>
        <div class="tools-toggle-list">
          <label class="tools-toggle">
            <input type="checkbox" id="npc-secret">
            <span>ステータスを非公開にする</span>
          </label>
          <label class="tools-toggle">
            <input type="checkbox" id="npc-invisible">
            <span>発言時キャラクターを表示しない</span>
          </label>
          <label class="tools-toggle">
            <input type="checkbox" id="npc-hide-status">
            <span>盤面キャラクター一覧に表示しない</span>
          </label>
        </div>

        <h3 class="tools-section-title">コマンド</h3>
        <div class="tools-actions tools-actions-wrap">
          <button type="button" id="npc-preset-1d100" class="btn-secondary">プリセット: 1d100</button>
          <button type="button" id="npc-preset-ccb" class="btn-secondary">プリセット: CCB&lt;= 【技能】</button>
          <button type="button" id="npc-preset-1d3db" class="btn-secondary">プリセット: 1d3+DB</button>
          <button type="button" id="npc-preset-1d4db" class="btn-secondary">プリセット: 1d4+DB</button>
          <button type="button" id="npc-preset-1d6db" class="btn-secondary">プリセット: 1d6+DB</button>
          <button type="button" id="npc-preset-resb" class="btn-secondary">プリセット: RESB(攻 - 受)</button>
          <button type="button" id="npc-preset-param5" class="btn-secondary">プリセット: {能力}*5</button>
        </div>
        <div class="tools-actions tools-actions-start">
          <button type="button" id="npc-add-command" class="btn-secondary">コマンド追加</button>
        </div>
        <div id="npc-command-rows" class="tools-command-rows" aria-label="コマンド一覧"></div>

        <div class="tools-actions">
          <button type="button" id="npc-copy-json" class="btn-primary">ココフォリア JSON をコピー</button>
        </div>
      </div>
    </main>

    <footer>
      <hr />
      <small><a href="../index.html">Back to Home</a></small>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/init-supabase.js"></script>
  <script src="../js/site-config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/tools-common.js"></script>
  <script src="../js/tools-npc-token.js"></script>
  <script>
    Utils.initAuthAndHeader("common-nav", "../");
  </script>
</body>
</html>
